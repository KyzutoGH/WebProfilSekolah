services:
  - type: web
    name: WebProfilSekolah
    env: docker
    plan: free
    repo: https://github.com/KyzutoGH/WebProfilSekolah
    dockerfilePath: ./Dockerfile
    buildCommand: "composer install && npm install && npm run build"
    startCommand: "php artisan serve --host=0.0.0.0 --port=80"
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_KEY
        generateValue: true
      - key: APP_DEBUG
        value: false
